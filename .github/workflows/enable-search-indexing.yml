name: Enable search indexing

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/enable-search-indexing.yml"

permissions:
  contents: write

jobs:
  update-index-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable indexing and set canonical URL
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")

          content = content.replace(
              '<meta name="robots" content="noindex, nofollow">',
              '<meta name="robots" content="index, follow">',
          )

          canonical = '<link rel="canonical" href="https://christofkoolen.com/">'
          if canonical not in content:
              marker = '<meta name="robots" content="index, follow">'
              content = content.replace(marker, f"{marker}\n  {canonical}", 1)

          path.write_text(content, encoding="utf-8")

      - name: Commit metadata update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No metadata changes required."
          else
            git commit -m "Enable search engine indexing"
            git push
          fi
